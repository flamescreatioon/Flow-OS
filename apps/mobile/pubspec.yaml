name: flowos_mobile
description: flowOS Mobile Application
version: 0.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  # Networking
  dio: ^5.4.0
  # Local storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  # Database
  sqflite: ^2.3.0
  path: ^1.9.0
  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # UUID
  uuid: ^4.4.0
  # Logging
  logger: ^2.4.0
  path_provider: ^2.1.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
