name: Bug Report
description: Report an issue or unexpected behavior in flowOS
title: "fix: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in flowOS.
        **Security Warning:** Do NOT include secrets, access tokens, API keys, customer financial data, or production credentials in this report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we trigger this issue?
      placeholder: |
        1. Navigate to ...
        2. Execute ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affected Platform / Component
      description: Which area of flowOS is affected?
      multiple: true
      options:
        - Web (Next.js)
        - API (Laravel)
        - Mobile (Flutter)
        - Desktop (.NET)
        - Shared Contracts / Types
        - Infrastructure / Docker
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, browser, device, or runtime details.
      placeholder: e.g. Windows 11, Ubuntu 22.04, Pixel 7 (Android 14), Chrome 124, PHP 8.2, Node 20
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant stack traces, terminal logs, or console output (ensure secrets are redacted).
      render: shell
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How critical is this issue?
      options:
        - Low (Cosmetic, minor inconvenience)
        - Medium (Feature impaired, workaround available)
        - High (Core workflow blocked, data integrity risk)
        - Critical (System failure, crash, security/financial bug)
    validations:
      required: true
