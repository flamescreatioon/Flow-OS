version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /apps/desktop
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
