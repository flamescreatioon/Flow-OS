openapi: 3.0.3
info:
  title: flowOS API
  version: 1.0.0
  description: |
    flowOS Business Operating System API

    **Implementation status:** `GET /health`, Authentication (Sanctum session + personal access tokens,
    registration, password reset, email verification), Organization lifecycle, Branch management,
    Organization invitations/memberships, Organization-scoped RBAC, Devices, and Audit events are
    implemented in this repository. This contract describes deployed endpoints only: organization
    deletion and platform user administration are not part of the API and are not described here.

    ## Authentication

    Implemented authentication uses Laravel Sanctum in two modes:

    - Web sessions: `POST /auth/login` (cookie session), `POST /auth/logout`, `POST /auth/logout-all`.
    - API tokens: `POST /auth/token` returns a Bearer personal access token for mobile/desktop clients.

    Include the token in the Authorization header:
    ```
    Authorization: Bearer {token}
    ```

    Tenant routes additionally require `auth:sanctum` plus an active platform user
    (`active-user`). Email verification status is available via `GET /auth/me`;
    tenant write operations require a verified email and return `EMAIL_NOT_VERIFIED` otherwise.

    ## Multi-tenancy

    Tenant selection is separate from authorization. A selected organization is usable
    only when the authenticated user has an active organization membership. Selection may use:
    - Subdomain (e.g., `myorg.flowos.local`)
    - `X-Organization-ID` header (selector only; never authorization)

    ## Offline-First

    Offline synchronization is planned architecture, not an implemented API contract.
    - Synchronized records will use UUIDv7 identities.
    - Future sync operations will be idempotent and use opaque cursors.
    - Conflict resolution will be domain-specific; universal last-write-wins is not used.

    ## Rate Limiting

    Standard rate limits apply. Check `X-RateLimit-*` headers.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.flowos.local/api/v1
    description: Production server

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /organizations:
    get:
      summary: List organizations available through active membership
      operationId: listOrganizations
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

    post:
      summary: Create an organization and bootstrap the creator membership
      operationId: createOrganization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          headers:
            Idempotent-Replayed:
              description: '`true` when the response was replayed from a stored idempotency record.'
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /organizations/{organization}:
    get:
      summary: Get organization by ID
      operationId: getOrganization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    patch:
      summary: Update organization
      operationId: updateOrganization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /organizations/{organization}/suspend:
    post:
      summary: Suspend an organization
      operationId: suspendOrganization
      tags: [Organizations]
      parameters:
        - name: organization
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization suspended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /organizations/{organization}/activate:
    post:
      summary: Activate a suspended organization
      operationId: activateOrganization
      tags: [Organizations]
      parameters:
        - name: organization
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization activated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /organizations/{organization}/close:
    post:
      summary: Close an organization permanently
      operationId: closeOrganization
      tags: [Organizations]
      parameters:
        - name: organization
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization closed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /organizations/{organization}/branches:
    get:
      summary: List branches for organization
      operationId: listBranches
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchesResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create a new branch
      operationId: createBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}:
    get:
      summary: Get branch by ID
      operationId: getBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update branch
      operationId: updateBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/activate:
    post:
      summary: Activate an inactive branch
      operationId: activateBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/deactivate:
    post:
      summary: Deactivate an active branch
      operationId: deactivateBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/close:
    post:
      summary: Close an active or inactive branch
      operationId: closeBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/make-primary:
    post:
      summary: Make a branch the primary branch for the organization
      operationId: makeBranchPrimary
      tags:
        - Branches
      security:
        - bearerAuth: []
          OrganizationSelector: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch made primary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      summary: Create a browser session
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Browser session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '202':
          description: |
            The password was accepted but the account has multi-factor authentication enrolled, so
            no session was created. Redeem the returned challenge with `POST /auth/mfa/verify`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      summary: Logout and revoke token
      operationId: logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/me:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/register:
    post:
      summary: Register a platform user
      operationId: register
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRegisterRequest' }
      responses:
        '201':
          description: Platform user created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUserResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token:
    post:
      summary: Create a mobile or desktop personal access token
      operationId: createToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthTokenRequest' }
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '202':
          description: |
            The password was accepted but the account has multi-factor authentication enrolled, so
            no token was created. Redeem the returned challenge with `POST /auth/mfa/verify`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout-all:
    post:
      summary: Revoke all personal access tokens and end the current session when applicable
      operationId: logoutAll
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Authentication state cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/forgot-password:
    post:
      summary: Request a password reset link
      operationId: forgotPassword
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: Request accepted without disclosing account existence }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      summary: Reset a password with a broker token
      operationId: resetPassword
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Password reset }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/email/verification-notification:
    post:
      summary: Send an email verification notification
      operationId: sendEmailVerificationNotification
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Already verified }
        '202': { description: Verification link sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/email/verify/{id}/{hash}:
    get:
      summary: Verify an email using a signed URL
      operationId: verifyEmail
      tags: [Authentication]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - name: hash
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email verified or already verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/enroll:
    post:
      summary: Start multi-factor enrolment and return the authenticator secret
      operationId: enrollMfa
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: |
            A pending enrolment was created. The secret and its otpauth URI are returned once and
            are discarded if the enrolment is not confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '409': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mfa/confirm:
    post:
      summary: Confirm multi-factor enrolment and return the recovery codes
      operationId: confirmMfa
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaCodeRequest' } } } }
      responses:
        '200':
          description: The account is enrolled. The recovery codes are returned exactly once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodesResponse' }
        '401': { $ref: '#/components/responses/MfaCodeInvalid' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '409': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mfa/verify:
    post:
      summary: Redeem a multi-factor challenge for the credential it was issued for
      operationId: verifyMfa
      tags: [Authentication]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerifyRequest' } } } }
      responses:
        '200':
          description: The session was created for a session challenge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUserResponse' }
        '201':
          description: The personal access token was created for a token challenge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/MfaChallengeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/MfaLocked' }
  /auth/mfa/disable:
    post:
      summary: Remove multi-factor authentication from the authenticated account
      operationId: disableMfa
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaCodeRequest' } } } }
      responses:
        '204': { description: Multi-factor authentication removed }
        '401': { $ref: '#/components/responses/MfaCodeInvalid' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '409': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /organizations/{organization}/invitations:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listOrganizationInvitations
      summary: List organization invitations
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Invitations, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationInvitationCollection' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: createOrganizationInvitation
      summary: Create an organization invitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvitationRequest' } } } }
      responses:
        '201':
          description: Invitation created
          headers:
            Idempotent-Replayed:
              description: '`true` when the response was replayed from a stored idempotency record.'
              schema:
                type: boolean
          content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationInvitationResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /organizations/{organization}/invitations/{invitation}/resend:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/InvitationId' }]
    post:
      operationId: resendOrganizationInvitation
      summary: Rotate and resend an invitation token
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Invitation resent, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationLifecycleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/invitations/{invitation}/cancel:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/InvitationId' }]
    post:
      operationId: cancelOrganizationInvitation
      summary: Cancel an invitation
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Invitation cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationLifecycleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /invitations/{token}:
    parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
    get:
      operationId: inspectInvitation
      summary: Inspect an invitation using its raw token
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Safe invitation information, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationInspectionResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /invitations/{token}/accept:
    parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
    post:
      operationId: acceptInvitation
      summary: Accept an invitation as the matching authenticated user
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Invitation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationLifecycleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /invitations/{token}/decline:
    parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
    post:
      operationId: declineInvitation
      summary: Decline an invitation as the matching authenticated user
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Invitation declined, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationLifecycleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/memberships:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listOrganizationMemberships
      summary: List organization memberships
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Memberships, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationMembershipCollection' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/memberships/{membership}:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/MembershipId' }]
    get:
      operationId: getOrganizationMembership
      summary: Get an organization membership
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Membership, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationMembershipResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/memberships/{membership}/suspend:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/MembershipId' }]
    post:
      operationId: suspendOrganizationMembership
      summary: Suspend an active membership
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Membership transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipLifecycleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/memberships/{membership}/activate:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/MembershipId' }]
    post:
      operationId: activateOrganizationMembership
      summary: Activate a suspended membership
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Membership transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipLifecycleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/memberships/{membership}/revoke:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/MembershipId' }]
    post:
      operationId: revokeOrganizationMembership
      summary: Revoke a membership
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Membership transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipLifecycleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/permissions:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listOrganizationPermissions
      summary: List the canonical permission catalogue
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Permissions, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionCollection' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/roles:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listOrganizationRoles
      summary: List organization roles
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Roles, content: { application/json: { schema: { $ref: '#/components/schemas/RoleCollection' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: createOrganizationRole
      summary: Create a custom organization role
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRoleRequest' } } } }
      responses: { '201': { description: Role, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/roles/{role}:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/RoleId' }]
    get:
      operationId: getOrganizationRole
      summary: Get an organization role
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Role, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
    patch:
      operationId: updateOrganizationRole
      summary: Update a custom organization role
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRoleRequest' } } } }
      responses: { '200': { description: Role, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
    delete:
      operationId: deleteOrganizationRole
      summary: Delete an unassigned custom role
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Role deleted }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/memberships/{membership}/roles:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }, { $ref: '#/components/parameters/MembershipId' }]
    put:
      operationId: assignOrganizationMembershipRoles
      summary: Replace a membership's assigned roles
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignRolesRequest' } } } }
      responses: { '200': { description: Roles assigned, content: { application/json: { schema: { $ref: '#/components/schemas/RoleCollection' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/me/permissions:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: getEffectiveOrganizationPermissions
      summary: Get the caller's effective organization permissions
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Effective permissions, content: { application/json: { schema: { $ref: '#/components/schemas/EffectivePermissionsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /devices:
    get:
      operationId: listDevices
      summary: List the caller's registered devices
      tags: [Devices]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Devices, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceCollection' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: registerDevice
      summary: Register a user device
      tags: [Devices]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDeviceRequest' } } } }
      responses: { '201': { description: Device, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /devices/{device}/revoke:
    parameters: [{ name: device, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: revokeDeviceByPath
      summary: Revoke a user device
      tags: [Devices]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Device revoked, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /organizations/{organization}/audit-events:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listAuditEvents
      summary: List append-only audit events for an organization
      tags: [Audit]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Audit events, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventCollection' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token

    OrganizationSelector:
      type: apiKey
      in: header
      name: X-Organization-ID
      description: |
        Selects an organization for tenant-authenticated routes; the server verifies active
        membership before the selection is used. A subdomain selector (for example
        `myorg.flowos.local`) is an equivalent alternative to this header.

  parameters:
    Page:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    NestedOrganizationId:
      name: organization
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    BranchId:
      name: branch
      in: path
      required: true
      description: Branch UUID
      schema:
        type: string
        format: uuid

    MembershipId:
      name: membership
      in: path
      required: true
      schema: { type: string, format: uuid }

    InvitationId:
      name: invitation
      in: path
      required: true
      schema: { type: string, format: uuid }

    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    RoleId:
      name: role
      in: path
      required: true
      schema: { type: string, format: uuid }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes this write replay-safe. Repeating the request with the same key and the same
        payload returns the original response with `Idempotent-Replayed: true`. Reusing the key
        with a different payload returns `409 IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        maxLength: 100

  schemas:
    UUID:
      type: string
      format: uuid
      example: "018f4c8e-7b3d-7c8a-9f4e-1a2b3c4d5e6f"

    UserStatus:
      type: string
      enum: [active, suspended, disabled]

    OrganizationStatus:
      type: string
      enum: [active, suspended, closed]

    MembershipStatus:
      type: string
      enum: [invited, active, suspended, revoked]

    BranchStatus:
      type: string
      enum: [active, inactive, closed]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: flowos-api

    Organization:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          example: "Acme Trading Co."
        legal_name:
          type: string
          nullable: true
        business_type:
          type: string
          nullable: true
        registration_number:
          type: string
          nullable: true
        slug:
          type: string
          example: "acme-trading"
        timezone:
          type: string
          example: "Africa/Lagos"
        currency:
          type: string
          example: "NGN"
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        settings:
          type: object
          nullable: true
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
          default: "Africa/Lagos"
        currency:
          type: string
          default: "NGN"

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
        currency:
          type: string
        settings:
          type: object

    OrganizationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Organization'

    PaginatedOrganizationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    Branch:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        code:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address_line_1:
          type: string
          nullable: true
        address_line_2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          nullable: true
        is_primary:
          type: boolean
        status:
          $ref: '#/components/schemas/BranchStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBranchRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        is_primary:
          type: boolean
          default: false

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'

    BranchResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Branch'

    PaginatedBranchesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationMembership:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        joined_at:
          type: string
          format: date-time
          nullable: true
        suspended_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    AuthRegisterRequest:
      type: object
      required:
        - email
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthTokenRequest:
      allOf:
        - $ref: '#/components/schemas/AuthLoginRequest'
        - type: object
          required: [client_name]
          properties:
            client_name: { type: string, maxLength: 255 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    AuthenticatedUserResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }

    TokenResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        user: { $ref: '#/components/schemas/User' }

    MfaChallengeResponse:
      type: object
      required: [mfa_required, challenge, expires_at, methods]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        challenge:
          type: string
          description: Opaque single-use challenge that must be redeemed with a second factor.
        expires_at: { type: string, format: date-time }
        methods:
          type: array
          items: { type: string, enum: [totp, recovery_code] }

    MfaEnrollmentResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            secret:
              type: string
              description: Base32 shared secret to register in an authenticator application.
            otpauth_uri:
              type: string
              description: otpauth URI to open in an authenticator application.

    MfaRecoveryCodesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            recovery_codes:
              type: array
              description: Single-use recovery codes, returned exactly once.
              items: { type: string }

    MfaCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A time-based one-time password or a single-use recovery code.

    MfaVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string }
        code:
          type: string
          description: A time-based one-time password or a single-use recovery code.

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    OrganizationMembershipResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationMembership' } }
    OrganizationMembershipCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationMembership' } } }
    OrganizationInvitation:
      type: object
      required: [id, email, state, expires_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        email: { type: string, format: email }
        state: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        declined_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        invited_by: { $ref: '#/components/schemas/User' }
    OrganizationInvitationResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationInvitation' } }
    OrganizationInvitationCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationInvitation' } } }
    CreateInvitationRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    InvitationInspectionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            organization_name: { type: string }
            email: { type: string, format: email }
            expires_at: { type: string, format: date-time }
            state: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
    InvitationLifecycleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationInvitation' } }
    MembershipLifecycleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationMembership' } }
    Permission:
      type: object
      properties: { id: { $ref: '#/components/schemas/UUID' }, key: { type: string }, description: { type: string, nullable: true } }
    PermissionCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Permission' } } }
    Role:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    RoleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/Role' } }
    RoleCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Role' } } }
    CreateRoleRequest:
      type: object
      required: [name]
      properties: { name: { type: string }, description: { type: string }, permission_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    UpdateRoleRequest:
      type: object
      properties: { name: { type: string }, description: { type: string }, permission_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    AssignRolesRequest:
      type: object
      required: [role_ids]
      properties: { role_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    EffectivePermissionsResponse:
      type: object
      properties:
        data:
          type: object
          properties: { roles: { type: array, items: { $ref: '#/components/schemas/Role' } }, permissions: { type: array, items: { type: string } } }
    Device:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        platform: { type: string }
        device_name: { type: string, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    DeviceResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/Device' } }
    DeviceCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Device' } } }
    CreateDeviceRequest:
      type: object
      required: [platform]
      properties: { platform: { type: string }, device_name: { type: string } }
    AuditEvent:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        event_type: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid, nullable: true }
        actor_user_id: { type: string, format: uuid, nullable: true }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
    AuditEventCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    TenantRequired:
      description: Organization context is required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: TENANT_REQUIRED }
                  message: { type: string }

    TenantAccessDenied:
      description: |
        The request was refused. `error.code` is `TENANT_ACCESS_DENIED` when the selected
        organization is not authorized, `EMAIL_NOT_VERIFIED` when the caller's email address is not
        verified, or `FORBIDDEN` when the caller lacks the required permission.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: TENANT_ACCESS_DENIED }
                  message: { type: string }

    EmailNotVerified:
      description: |
        The write was refused. `error.code` is `EMAIL_NOT_VERIFIED` when the caller's email address
        is not verified, or `FORBIDDEN` when the caller lacks the required permission.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: EMAIL_NOT_VERIFIED }
                  message: { type: string }

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: RATE_LIMITED }
                  message: { type: string }

    IdempotencyConflict:
      description: |
        Idempotency key reused with a different payload, or reused while an earlier request with
        the same key is still being processed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: IDEMPOTENCY_CONFLICT }
                  message: { type: string }

    MfaCodeInvalid:
      description: |
        The second factor is not valid. `error.code` is `MFA_CODE_INVALID` when the code does not
        match, or `MFA_NOT_ENROLLED` when the account has no multi-factor enrolment.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_CODE_INVALID }
                  message: { type: string }

    MfaChallengeInvalid:
      description: |
        The multi-factor challenge is unknown, expired, or has already been redeemed.
        `error.code` is `MFA_CHALLENGE_INVALID`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_CHALLENGE_INVALID }
                  message: { type: string }

    MfaLocked:
      description: |
        The multi-factor challenge has exhausted its verification attempts and can no longer be
        redeemed. `error.code` is `MFA_LOCKED`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_LOCKED }
                  message: { type: string }

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
