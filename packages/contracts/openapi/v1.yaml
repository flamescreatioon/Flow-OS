          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GoodsReceiptStatus:
      type: string
      description: A receipt is finalized on creation (ADR 0035); every receipt is recorded.
      enum: [recorded]

    GoodsReceiptLine:
      type: object
      description: One product line of a goods receipt. The product name and cost are snapshots, so history never depends on the current catalogue entry.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        goods_receipt_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: string
          description: The received magnitude as an exact decimal string in thousandths of a unit of measure.
          pattern: '^-?\d+(\.\d{1,3})?$'
          example: "12.500"
        unit_cost:
          type: string
          description: Exact unit cost decimal string in the organization currency, carried to the unit price scale of 4 fractional digits.
          pattern: '^-?\d+(\.\d{1,4})?$'
          example: "2500.5000"
        line_total:
          type: string
          description: Server-computed line total, rounded half-up to the unit price scale.
          pattern: '^-?\d+(\.\d{1,4})?$'
          example: "31256.2500"

    GoodsReceipt:
      type: object
      description: |
        An immutable commercial record of goods received into a location (ADR 0035). Each line
        produced one receipt-category stock movement carrying the line's cost and referencing the
        receipt; the receipt never edits stock balances directly. There is no update or delete path.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        supplier_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        supplier_name:
          type: string
          nullable: true
          description: Snapshot of the supplier name at receipt time.
        location_id:
          $ref: '#/components/schemas/UUID'
        receipt_number:
          type: integer
          description: The organization-scoped sequential number.
        document_number:
          type: string
          example: "GRN-000042"
        status:
          $ref: '#/components/schemas/GoodsReceiptStatus'
        received_on:
          type: string
          format: date
          description: The calendar date the goods were received, as YYYY-MM-DD.
        note:
          type: string
          nullable: true
        total_cost:
          type: string
          description: Server-computed receipt total in the organization currency, at the unit price scale.
          pattern: '^-?\d+(\.\d{1,4})?$'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GoodsReceiptLine'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

