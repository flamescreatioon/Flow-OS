    CreateStockMovementRequest:
      type: object
      required: [product_id, location_id, type, quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        location_id:
          $ref: '#/components/schemas/UUID'
        type:
          $ref: '#/components/schemas/StockMovementType'
        quantity:
          type: string
          description: |
            Exact decimal string with at most 3 fractional digits (thousandths of a unit).
            For `opening`, `receipt`, `sale`, and `return` this is a magnitude and the server
            applies the direction. For `adjustment` this is a signed quantity. Transfers and
            counts have their own endpoints and are rejected here.
          pattern: '^-?\d+(\.\d{1,3})?$'
        unit_cost:
          type: string
          description: Exact decimal string with at most 4 fractional digits.
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
        reference:
          type: string
          maxLength: 100
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true
        occurred_at:
          type: string
          format: date-time
          description: Defaults to now when omitted.
        corrects_movement_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: |
            The movement this correction reverses. The correction must be for the same product
            and location, must move stock in the opposite direction, and the original must not
            have been corrected before.

    CreateStockCountRequest:
      type: object
      required: [product_id, location_id, counted_quantity]
