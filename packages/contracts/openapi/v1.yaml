        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateInventoryLocationRequest' } } }
      responses: { '200': { description: Location updated, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryLocationResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/inventory-locations/{location}/archive:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/LocationId' }
    post:
      operationId: archiveInventoryLocation
      summary: Archive an inventory location
      description: Requires the `stock.move` permission. An archived location cannot hold further stock movements.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Location archived, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryLocationResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-movements:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listStockMovements
      summary: List stock movements
      description: |
        Requires the `stock.view` permission. Movement records are immutable and the server
        establishes the list order (most recent first), regardless of any client-supplied
        `occurred_at` on the records.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: location_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/StockMovementType' } }
      responses: { '200': { description: Paginated stock movements, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedStockMovementsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: recordStockMovement
      summary: Record a stock movement
      description: |
        Requires the `stock.move` permission, or `stock.adjust` when `type` is `adjustment`.
        The direction is a property of the category, not of the caller: fixed-direction
        categories (`opening`, `receipt`, `sale`, `return`) take a magnitude and the server
        applies the sign; `adjustment` takes a signed quantity. A correction
        (`corrects_movement_id`) must move stock in the opposite direction to the movement it
        corrects, and a movement may be corrected at most once. Negative balances are
        permitted and reported; the server never rejects a movement merely for driving stock
        below zero.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockMovementRequest' } } }
      responses: { '201': { description: Movement recorded, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-balances:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listStockBalances
      summary: List derived stock balances
      description: |
        Requires the `stock.view` permission. A balance is a read model maintained in the same
        transaction as the movements that produced it; it is never a client-writable quantity.
        Up to 100 per page, ordered by product then location.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: location_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
      responses: { '200': { description: Paginated stock balances, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedStockBalancesResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-counts:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    post:
      operationId: recordStockCount
      summary: Record a stock count
      description: |
        Requires the `stock.count` permission. The client states the counted quantity only;
        the server computes the variance against the current balance and records it as a
        `count` movement. A count that finds no variance is still recorded as evidence.
        The counted quantity may not carry more decimal places than the product's unit of
        measure allows.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockCountRequest' } } }
      responses: { '201': { description: Count recorded, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-transfers:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    post:
      operationId: recordStockTransfer
      summary: Transfer stock between two locations
      description: |
        Requires the `stock.transfer` permission. Creates a linked pair of immutable
        movements (`transfer_out` at the source, `transfer_in` at the destination) that
        reference each other through `transfer_movement_id`.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockTransferRequest' } } }
      responses: { '201': { description: Transfer recorded, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/StockTransferResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token

    OrganizationSelector:
      type: apiKey
      in: header
      name: X-Organization-ID
      description: |
        Selects an organization for tenant-authenticated routes; the server verifies active
        membership before the selection is used. A subdomain selector (for example
        `myorg.flowos.local`) is an equivalent alternative to this header.

  parameters:
    Page:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    NestedOrganizationId:
      name: organization
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    BranchId:
      name: branch
      in: path
      required: true
      description: Branch UUID
      schema:
        type: string
        format: uuid

    MembershipId:
      name: membership
      in: path
      required: true
      schema: { type: string, format: uuid }

    InvitationId:
      name: invitation
      in: path
      required: true
      schema: { type: string, format: uuid }

    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    RoleId:
      name: role
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProductId:
      name: product
      in: path
      required: true
      schema: { type: string, format: uuid }

    CategoryId:
      name: category
      in: path
      required: true
      schema: { type: string, format: uuid }

    LocationId:
      name: location
      in: path
      required: true
      schema: { type: string, format: uuid }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes this write replay-safe. Repeating the request with the same key and the same
        payload returns the original response with `Idempotent-Replayed: true`. Reusing the key
        with a different payload returns `409 IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        maxLength: 100

  schemas:
    UUID:
      type: string
      format: uuid
      example: "018f4c8e-7b3d-7c8a-9f4e-1a2b3c4d5e6f"

    UserStatus:
      type: string
      enum: [active, suspended, disabled]

    OrganizationStatus:
      type: string
      enum: [active, suspended, closed]

    MembershipStatus:
      type: string
      enum: [invited, active, suspended, revoked]

    BranchStatus:
      type: string
      enum: [active, inactive, closed]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: flowos-api

    Organization:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          example: "Acme Trading Co."
        legal_name:
          type: string
          nullable: true
        business_type:
          type: string
          nullable: true
        registration_number:
          type: string
          nullable: true
        slug:
          type: string
          example: "acme-trading"
        timezone:
          type: string
          example: "Africa/Lagos"
        currency:
          type: string
          example: "NGN"
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        settings:
          type: object
          nullable: true
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
          default: "Africa/Lagos"
        currency:
          type: string
          default: "NGN"

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
        currency:
          type: string
        settings:
          type: object

    OrganizationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Organization'

    PaginatedOrganizationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    Branch:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        code:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address_line_1:
          type: string
          nullable: true
        address_line_2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          nullable: true
        is_primary:
          type: boolean
        status:
          $ref: '#/components/schemas/BranchStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBranchRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        is_primary:
          type: boolean
          default: false

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'

    BranchResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Branch'

    PaginatedBranchesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationMembership:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        joined_at:
          type: string
          format: date-time
          nullable: true
        suspended_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    AuthRegisterRequest:
      type: object
      required:
        - email
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthTokenRequest:
      allOf:
        - $ref: '#/components/schemas/AuthLoginRequest'
        - type: object
          required: [client_name]
          properties:
            client_name: { type: string, maxLength: 255 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    AuthenticatedUserResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }

    TokenResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        user: { $ref: '#/components/schemas/User' }

    MfaChallengeResponse:
      type: object
      required: [mfa_required, challenge, expires_at, methods]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        challenge:
          type: string
          description: Opaque single-use challenge that must be redeemed with a second factor.
        expires_at: { type: string, format: date-time }
        methods:
          type: array
          items: { type: string, enum: [totp, recovery_code] }

    MfaEnrollmentResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            secret:
              type: string
              description: Base32 shared secret to register in an authenticator application.
            otpauth_uri:
              type: string
              description: otpauth URI to open in an authenticator application.

    MfaRecoveryCodesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            recovery_codes:
              type: array
              description: Single-use recovery codes, returned exactly once.
              items: { type: string }

    MfaCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A time-based one-time password or a single-use recovery code.

    MfaVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string }
        code:
          type: string
          description: A time-based one-time password or a single-use recovery code.

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    OrganizationMembershipResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationMembership' } }
    OrganizationMembershipCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationMembership' } } }
    OrganizationInvitation:
      type: object
      required: [id, email, state, expires_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        email: { type: string, format: email }
        state: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        declined_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        invited_by: { $ref: '#/components/schemas/User' }
    OrganizationInvitationResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationInvitation' } }
    OrganizationInvitationCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationInvitation' } } }
    CreateInvitationRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    InvitationInspectionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            organization_name: { type: string }
            email: { type: string, format: email }
            expires_at: { type: string, format: date-time }
            state: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
    InvitationLifecycleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationInvitation' } }
    MembershipLifecycleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationMembership' } }
    Permission:
      type: object
      properties: { id: { $ref: '#/components/schemas/UUID' }, key: { type: string }, description: { type: string, nullable: true } }
    PermissionCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Permission' } } }
    Role:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    RoleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/Role' } }
    RoleCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Role' } } }
    CreateRoleRequest:
      type: object
      required: [name]
      properties: { name: { type: string }, description: { type: string }, permission_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    UpdateRoleRequest:
      type: object
      properties: { name: { type: string }, description: { type: string }, permission_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    AssignRolesRequest:
      type: object
      required: [role_ids]
      properties: { role_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    EffectivePermissionsResponse:
      type: object
      properties:
        data:
          type: object
          properties: { roles: { type: array, items: { $ref: '#/components/schemas/Role' } }, permissions: { type: array, items: { type: string } } }
    Device:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        platform: { type: string }
        device_name: { type: string, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    DeviceResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/Device' } }
    DeviceCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Device' } } }
    CreateDeviceRequest:
      type: object
      required: [platform]
      properties: { platform: { type: string }, device_name: { type: string } }
    AuditEvent:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        event_type: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid, nullable: true }
        actor_user_id: { type: string, format: uuid, nullable: true }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
    AuditEventCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }

    ProductType:
      type: string
      description: |
        How a product behaves in inventory. A `stocked` product is tracked in inventory and is
        the only kind that may take stock movements and balances; a `non_stocked` product is
        bought and resold without tracking; a `service` has no stock at all.
      enum: [stocked, non_stocked, service]

    StockMovementType:
      type: string
      description: |
        The reason a stock movement was recorded. The direction is a property of the category:
        `opening`, `receipt`, and `return` increase stock; `sale` and `transfer_out` decrease it;
        `transfer_in` increases it at the destination; `adjustment` and `count` carry a signed
        variance. The server applies the sign for the fixed-direction categories, so a client
        never states a negative quantity for them.
      enum: [opening, receipt, sale, return, adjustment, transfer_in, transfer_out, count]

    DecimalString:
      type: string
      description: |
        An exact decimal transported as a string so no client parses it as a binary floating
        point number. Canonical form: optional leading `-`, a required integer part, at most
        the stated number of fractional digits, no thousands separators and no trailing point.
      pattern: '^-?\d+(\.\d+)?$'

    UnitOfMeasure:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        code:
          type: string
          example: "kg"
        name:
          type: string
          example: "Kilogram"
        precision:
          type: integer
          description: The maximum number of decimal places a quantity in this unit may carry (0-3).
          minimum: 0
          maximum: 3
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        sku:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/ProductType'
        price:
          type: string
          description: Exact unit price decimal string in the organization currency, carried to the unit price scale of 4 fractional digits.
          pattern: '^-?\d+(\.\d{1,4})?$'
          example: "1500.0000"
        tax_code:
          type: string
          nullable: true
        unit_of_measure:
          $ref: '#/components/schemas/UnitOfMeasure'
        category:
          $ref: '#/components/schemas/Category'
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InventoryLocation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 150
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StockMovement:
      type: object
      description: |
        An immutable record of a stock change. A movement is never edited or deleted; a
        mistake is repaired by recording a correction that points at the movement it reverses.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        location_id:
          $ref: '#/components/schemas/UUID'
        type:
          $ref: '#/components/schemas/StockMovementType'
        quantity:
          type: string
          description: |
            The signed applied quantity as an exact decimal string in thousandths of a unit of
            measure (at most 3 fractional digits). Positive increases stock, negative decreases it.
          pattern: '^-?\d+(\.\d{1,3})?$'
          example: "-12.500"
        unit_cost:
          type: string
          description: Exact decimal string on the unit price scale of 4 fractional digits, when the movement carries one.
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
        reference:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
          description: Business context for when the change happened; not the ordering key.
        corrects_movement_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        transfer_movement_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: The other half of a transfer pair; set on both halves.
        created_at: { type: string, format: date-time }

    StockBalance:
      type: object
      description: A derived read model of the quantity on hand; maintained from movements, never client-writable.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        location_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          $ref: '#/components/schemas/DecimalString'
        product:
          $ref: '#/components/schemas/Product'
        location:
          $ref: '#/components/schemas/InventoryLocation'
        updated_at: { type: string, format: date-time }

    CreateProductRequest:
      type: object
      required: [name, type, price, unit_of_measure_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          maxLength: 100
          nullable: true
        type:
          $ref: '#/components/schemas/ProductType'
        price:
          type: string
          description: Exact unit price decimal string with at most 4 fractional digits, in the organization currency.
          pattern: '^-?\d+(\.\d{1,4})?$'
        tax_code:
          type: string
          maxLength: 50
          nullable: true
        unit_of_measure_id:
          $ref: '#/components/schemas/UUID'
        category_id:
          $ref: '#/components/schemas/UUID'
          nullable: true

    UpdateProductRequest:
      type: object
      description: Only the fields present in the body change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          maxLength: 100
          nullable: true
        type:
          $ref: '#/components/schemas/ProductType'
        price:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
        tax_code:
          type: string
          maxLength: 50
          nullable: true
        unit_of_measure_id:
          $ref: '#/components/schemas/UUID'
        category_id:
          $ref: '#/components/schemas/UUID'
          nullable: true

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 500
          nullable: true

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 500
          nullable: true

    CreateUnitOfMeasureRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 100
        precision:
          type: integer
          minimum: 0
          maximum: 3
          default: 0

    CreateInventoryLocationRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 150
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true

    UpdateInventoryLocationRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 150
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true

    CreateStockMovementRequest:
      type: object
      required: [product_id, location_id, type, quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        location_id:
          $ref: '#/components/schemas/UUID'
        type:
          $ref: '#/components/schemas/StockMovementType'
        quantity:
          type: string
          description: |
            Exact decimal string with at most 3 fractional digits (thousandths of a unit).
            For `opening`, `receipt`, `sale`, and `return` this is a magnitude and the server
            applies the direction. For `adjustment` this is a signed quantity. Transfers and
            counts have their own endpoints and are rejected here.
          pattern: '^-?\d+(\.\d{1,3})?$'
        unit_cost:
          type: string
          description: Exact decimal string with at most 4 fractional digits.
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
        reference:
          type: string
          maxLength: 100
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true
        occurred_at:
          type: string
          format: date-time
          description: Defaults to now when omitted.
        corrects_movement_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: |
            The movement this correction reverses. The correction must be for the same product
            and location, must move stock in the opposite direction, and the original must not
            have been corrected before.

    CreateStockCountRequest:
      type: object
      required: [product_id, location_id, counted_quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        location_id:
          $ref: '#/components/schemas/UUID'
        counted_quantity:
          type: string
          description: The quantity the count observed; never the balance. The server computes the variance. May not carry more decimal places than the product's unit of measure allows.
          pattern: '^\d+(\.\d{1,3})?$'
        reference:
          type: string
          maxLength: 100
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true
        occurred_at:
          type: string
          format: date-time

    CreateStockTransferRequest:
      type: object
      required: [product_id, from_location_id, to_location_id, quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        from_location_id:
          $ref: '#/components/schemas/UUID'
        to_location_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: string
          description: Exact decimal string with at most 3 fractional digits; a magnitude, applied out at the source and in at the destination.
          pattern: '^-?\d+(\.\d{1,3})?$'
        reference:
          type: string
          maxLength: 100
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true
        occurred_at:
          type: string
          format: date-time

    ProductResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Product'

    PaginatedProductsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    CategoryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Category'

    CategoryCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    UnitOfMeasureResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UnitOfMeasure'

    UnitOfMeasureCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitOfMeasure'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    InventoryLocationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/InventoryLocation'

    PaginatedInventoryLocationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLocation'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    StockMovementResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StockMovement'

    PaginatedStockMovementsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    StockTransferResponse:
      type: object
      description: The two halves of a transfer, created together.
      properties:
        data:
          type: object
          properties:
            outbound:
              $ref: '#/components/schemas/StockMovement'
            inbound:
              $ref: '#/components/schemas/StockMovement'

    PaginatedStockBalancesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockBalance'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    TenantRequired:
      description: Organization context is required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: TENANT_REQUIRED }
                  message: { type: string }

    TenantAccessDenied:
      description: |
        The request was refused. `error.code` is `TENANT_ACCESS_DENIED` when the selected
        organization is not authorized, `EMAIL_NOT_VERIFIED` when the caller's email address is not
        verified, or `FORBIDDEN` when the caller lacks the required permission.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: TENANT_ACCESS_DENIED }
                  message: { type: string }

    EmailNotVerified:
      description: |
        The write was refused. `error.code` is `EMAIL_NOT_VERIFIED` when the caller's email address
        is not verified, or `FORBIDDEN` when the caller lacks the required permission.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: EMAIL_NOT_VERIFIED }
                  message: { type: string }

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: RATE_LIMITED }
                  message: { type: string }

    IdempotencyConflict:
      description: |
        Idempotency key reused with a different payload, or reused while an earlier request with
        the same key is still being processed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: IDEMPOTENCY_CONFLICT }
                  message: { type: string }

    MfaCodeInvalid:
      description: |
        The second factor is not valid. `error.code` is `MFA_CODE_INVALID` when the code does not
        match, or `MFA_NOT_ENROLLED` when the account has no multi-factor enrolment.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_CODE_INVALID }
                  message: { type: string }

    MfaChallengeInvalid:
      description: |
        The multi-factor challenge is unknown, expired, or has already been redeemed.
        `error.code` is `MFA_CHALLENGE_INVALID`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_CHALLENGE_INVALID }
                  message: { type: string }

    MfaLocked:
      description: |
        The multi-factor challenge has exhausted its verification attempts and can no longer be
        redeemed. `error.code` is `MFA_LOCKED`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_LOCKED }
                  message: { type: string }

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
