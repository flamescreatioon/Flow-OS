            $ref: '#/components/schemas/Customer'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    InvoiceLine:
      type: object
      description: One billed line. On an issued invoice every commercial value is a snapshot from issue time.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        invoice_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        description:
          type: string
          maxLength: 300
        quantity:
          type: string
          description: Exact decimal string in thousandths of a unit of measure.
          pattern: '^-?\d+(\.\d{1,3})?$'
          example: "2.000"
        unit_price:
          type: string
          description: Exact decimal string at the unit price scale.
          pattern: '^-?\d+(\.\d{1,4})?$'
        discount:
          type: string
          description: Per-line discount amount at the unit price scale.
          pattern: '^-?\d+(\.\d{1,4})?$'
        tax_amount:
          type: string
          description: Computed at issue from the snapshot rate and mode; zero on drafts.
          pattern: '^-?\d+(\.\d{1,4})?$'
        line_total:
          type: string
          description: Server-computed; quantity x unit_price - discount, rounded half-up at the unit price scale.
          pattern: '^-?\d+(\.\d{1,4})?$'

    Invoice:
      type: object
      description: |
        A commercial obligation document (ADR 0036). Drafts are editable and carry no number; issue
        assigns the sequential document number and freezes the snapshot; void is terminal. An invoice
        has no stock effect in this slice, and payment state arrives with the Payments domain.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        customer_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        customer_name:
          type: string
          nullable: true
          description: Snapshot of the customer name.
        invoice_number:
          type: integer
          nullable: true
          description: The organization-scoped sequential number; assigned at issue.
        document_number:
          type: string
          nullable: true
          example: "INV-000042"
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        issued_at:
          type: string
          format: date-time
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
        due_on:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          description: ISO 4217 currency snapshot.
          minLength: 3
          maxLength: 3
        tax_rate_percent:
          type: string
          description: Snapshot rate as a percentage at the unit price scale; null on drafts.
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
        tax_mode:
          $ref: '#/components/schemas/TaxMode'
          nullable: true
        subtotal:
          type: string
          description: Net of tax; in inclusive mode this is grand_total - tax_total.
          pattern: '^-?\d+(\.\d{1,4})?$'
        discount_total:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
        tax_total:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
        grand_total:
          type: string
          description: The amount the customer owes.
          pattern: '^-?\d+(\.\d{1,4})?$'
        note:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateInvoiceLineRequest:
      type: object
      required: [description, quantity, unit_price]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        description:
          type: string
          minLength: 1
          maxLength: 300
        quantity:
          type: string
          description: A positive magnitude, canonical decimal at most 3 fractional digits.
          pattern: '^-?\d+(\.\d{1,3})?$'
        unit_price:
          type: string
          description: A non-negative canonical decimal at most 4 fractional digits.
          pattern: '^-?\d+(\.\d{1,4})?$'
        discount:
          type: string
          description: A non-negative amount at most 4 fractional digits; must not exceed the line amount.
          pattern: '^-?\d+(\.\d{1,4})?$'

    CreateInvoiceRequest:
      type: object
      required: [lines]
      properties:
        customer_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        due_on:
          type: string
          format: date
        note:
          type: string
          maxLength: 500
          nullable: true
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateInvoiceLineRequest'

    UpdateInvoiceRequest:
      type: object
      description: Only a draft is editable; lines are replaced as a whole when present.
      properties:
        customer_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        due_on:
          type: string
          format: date
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateInvoiceLineRequest'

    SendInvoiceRequest:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannelName'
        recipient:
          type: string
          maxLength: 255
          nullable: true
          description: Defaults from the attached customer's email (email channel) or phone (sms/whatsapp).

    InvoiceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Invoice'

    PaginatedInvoicesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    NotificationDelivery:
      type: object
      description: One tracked delivery attempt (ADR 0037); not business truth and never mutates the entity it points at.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        entity_type:
          type: string
        entity_id:
          $ref: '#/components/schemas/UUID'
        channel:
          $ref: '#/components/schemas/NotificationChannelName'
        driver:
          type: string
          description: The driver that handled the channel, e.g. "mail" or "log".
        recipient:
          type: string
        status:
          $ref: '#/components/schemas/NotificationDeliveryStatus'
        error_message:
          type: string
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }

    NotificationDeliveryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NotificationDelivery'

    PaginatedNotificationDeliveriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDelivery'
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    TenantRequired:
      description: Organization context is required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: TENANT_REQUIRED }
                  message: { type: string }

    TenantAccessDenied:
      description: |
        The request was refused. `error.code` is `TENANT_ACCESS_DENIED` when the selected
        organization is not authorized, `EMAIL_NOT_VERIFIED` when the caller's email address is not
        verified, or `FORBIDDEN` when the caller lacks the required permission.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: TENANT_ACCESS_DENIED }
                  message: { type: string }

    EmailNotVerified:
      description: |
        The write was refused. `error.code` is `EMAIL_NOT_VERIFIED` when the caller's email address
        is not verified, or `FORBIDDEN` when the caller lacks the required permission.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: EMAIL_NOT_VERIFIED }
                  message: { type: string }

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: RATE_LIMITED }
                  message: { type: string }

    IdempotencyConflict:
      description: |
        Idempotency key reused with a different payload, or reused while an earlier request with
        the same key is still being processed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: IDEMPOTENCY_CONFLICT }
                  message: { type: string }

    MfaCodeInvalid:
      description: |
        The second factor is not valid. `error.code` is `MFA_CODE_INVALID` when the code does not
        match, or `MFA_NOT_ENROLLED` when the account has no multi-factor enrolment.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_CODE_INVALID }
                  message: { type: string }

    MfaChallengeInvalid:
      description: |
        The multi-factor challenge is unknown, expired, or has already been redeemed.
        `error.code` is `MFA_CHALLENGE_INVALID`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_CHALLENGE_INVALID }
                  message: { type: string }

    MfaLocked:
      description: |
        The multi-factor challenge has exhausted its verification attempts and can no longer be
        redeemed. `error.code` is `MFA_LOCKED`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: MFA_LOCKED }
                  message: { type: string }

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
