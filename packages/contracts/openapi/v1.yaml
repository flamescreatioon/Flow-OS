openapi: 3.0.3
info:
  title: flowOS API
  version: 1.0.0
  description: |
    flowOS Business Operating System API

    **Implementation status:** `GET /health`, Organization lifecycle, and Branch management are implemented in this repository.
    Other paths retained in this v1 file are planned contracts and must not be
    treated as deployed endpoints.

    ## Authentication

    Planned authentication uses Laravel Sanctum for token-based authentication.

    Include the token in the Authorization header:
    ```
    Authorization: Bearer {token}
    ```

    ## Multi-tenancy

    Tenant selection is separate from authorization. A selected organization is usable
    only when the authenticated user has an active organization membership. Selection may use:
    - Subdomain (e.g., `myorg.flowos.local`)
    - `X-Organization-ID` header (selector only; never authorization)

    ## Offline-First

    Offline synchronization is planned architecture, not an implemented API contract.
    - Synchronized records will use UUIDv7 identities.
    - Future sync operations will be idempotent and use opaque cursors.
    - Conflict resolution will be domain-specific; universal last-write-wins is not used.

    ## Rate Limiting

    Standard rate limits apply. Check `X-RateLimit-*` headers.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.flowos.local/api/v1
    description: Production server

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /organizations:
    get:
      summary: List organizations available through active membership
      operationId: listOrganizations
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create an organization and bootstrap the creator membership
      operationId: createOrganization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{id}:
    get:
      summary: Get organization by ID
      operationId: getOrganization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update organization
      operationId: updateOrganization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Delete organization
      operationId: deleteOrganization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '204':
          description: Organization deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organization}/suspend:
    post:
      summary: Suspend an organization
      operationId: suspendOrganization
      tags: [Organizations]
      parameters:
        - name: organization
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization suspended }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{organization}/activate:
    post:
      summary: Activate a suspended organization
      operationId: activateOrganization
      tags: [Organizations]
      parameters:
        - name: organization
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization activated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{organization}/close:
    post:
      summary: Close an organization permanently
      operationId: closeOrganization
      tags: [Organizations]
      parameters:
        - name: organization
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organization closed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{organization}/branches:
    get:
      summary: List branches for organization
      operationId: listBranches
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create a new branch
      operationId: createBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}:
    get:
      summary: Get branch by ID
      operationId: getBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update branch
      operationId: updateBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/activate:
    post:
      summary: Activate an inactive branch
      operationId: activateBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/deactivate:
    post:
      summary: Deactivate an active branch
      operationId: deactivateBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/close:
    post:
      summary: Close an active or inactive branch
      operationId: closeBranch
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{organization}/branches/{branch}/make-primary:
    post:
      summary: Make a branch the primary branch for the organization
      operationId: makeBranchPrimary
      tags:
        - Branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedOrganizationId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch made primary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users:
    get:
      summary: List users for current organization
      operationId: listUsers
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    get:
      summary: Get user by ID
      operationId: getUser
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update user
      operationId: updateUser
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Delete user
      operationId: deleteUser
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/login:
    post:
      summary: Create a browser session
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Browser session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      summary: Logout and revoke token
      operationId: logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      summary: Register a platform user
      operationId: register
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRegisterRequest' }
      responses:
        '201':
          description: Platform user created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUserResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/token:
    post:
      summary: Create a mobile or desktop personal access token
      operationId: createToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthTokenRequest' }
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout-all:
    post:
      summary: Revoke all personal access tokens and end the current session when applicable
      operationId: logoutAll
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Authentication state cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      summary: Request a password reset link
      operationId: forgotPassword
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: Request accepted without disclosing account existence }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/reset-password:
    post:
      summary: Reset a password with a broker token
      operationId: resetPassword
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Password reset }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/email/verification-notification:
    post:
      summary: Send an email verification notification
      operationId: sendEmailVerificationNotification
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Already verified }
        '202': { description: Verification link sent }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/email/verify/{id}/{hash}:
    get:
      summary: Verify an email using a signed URL
      operationId: verifyEmail
      tags: [Authentication]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - name: hash
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email verified or already verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token

    OrganizationSelector:
      type: apiKey
      in: header
      name: X-Organization-ID
      description: Selects an organization for tenant-authenticated routes; the server verifies active membership.

  parameters:
    Page:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    OrganizationId:
      name: id
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    NestedOrganizationId:
      name: organization
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    BranchId:
      name: branch
      in: path
      required: true
      description: Branch UUID
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid

  schemas:
    UUID:
      type: string
      format: uuid
      example: "018f4c8e-7b3d-7c8a-9f4e-1a2b3c4d5e6f"

    UserStatus:
      type: string
      enum: [active, suspended, disabled]

    OrganizationStatus:
      type: string
      enum: [active, suspended, closed]

    MembershipStatus:
      type: string
      enum: [invited, active, suspended, revoked]

    BranchStatus:
      type: string
      enum: [active, inactive, closed]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: flowos-api

    Organization:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          example: "Acme Trading Co."
        legal_name:
          type: string
          nullable: true
        business_type:
          type: string
          nullable: true
        registration_number:
          type: string
          nullable: true
        slug:
          type: string
          example: "acme-trading"
        timezone:
          type: string
          example: "Africa/Lagos"
        currency:
          type: string
          example: "NGN"
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        settings:
          type: object
          nullable: true
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
          default: "Africa/Lagos"
        currency:
          type: string
          default: "NGN"

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
        currency:
          type: string
        settings:
          type: object

    OrganizationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Organization'

    PaginatedOrganizationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    Branch:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        code:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address_line_1:
          type: string
          nullable: true
        address_line_2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          nullable: true
        is_primary:
          type: boolean
        status:
          $ref: '#/components/schemas/BranchStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBranchRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
