      responses: { '200': { description: Location updated, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryLocationResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/inventory-locations/{location}/archive:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/LocationId' }
    post:
      operationId: archiveInventoryLocation
      summary: Archive an inventory location
      description: Requires the `stock.move` permission. An archived location cannot hold further stock movements.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Location archived, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryLocationResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-movements:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listStockMovements
      summary: List stock movements
      description: |
        Requires the `stock.view` permission. Movement records are immutable and the server
        establishes the list order (most recent first), regardless of any client-supplied
        `occurred_at` on the records.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: location_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/StockMovementType' } }
      responses: { '200': { description: Paginated stock movements, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedStockMovementsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: recordStockMovement
      summary: Record a stock movement
      description: |
        Requires the `stock.move` permission, or `stock.adjust` when `type` is `adjustment`.
        The direction is a property of the category, not of the caller: fixed-direction
        categories (`opening`, `receipt`, `sale`, `return`) take a magnitude and the server
        applies the sign; `adjustment` takes a signed quantity. A correction
        (`corrects_movement_id`) must move stock in the opposite direction to the movement it
        corrects, and a movement may be corrected at most once. Negative balances are
        permitted and reported; the server never rejects a movement merely for driving stock
        below zero.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockMovementRequest' } } }
      responses: { '201': { description: Movement recorded, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-balances:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listStockBalances
      summary: List derived stock balances
      description: |
        Requires the `stock.view` permission. A balance is a read model maintained in the same
        transaction as the movements that produced it; it is never a client-writable quantity.
        Up to 100 per page, ordered by product then location.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: location_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
      responses: { '200': { description: Paginated stock balances, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedStockBalancesResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-counts:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    post:
      operationId: recordStockCount
      summary: Record a stock count
      description: |
        Requires the `stock.count` permission. The client states the counted quantity only;
        the server computes the variance against the current balance and records it as a
        `count` movement. A count that finds no variance is still recorded as evidence.
        The counted quantity may not carry more decimal places than the product's unit of
        measure allows.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockCountRequest' } } }
      responses: { '201': { description: Count recorded, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/stock-transfers:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    post:
      operationId: recordStockTransfer
      summary: Transfer stock between two locations
      description: |
        Requires the `stock.transfer` permission. Creates a linked pair of immutable
        movements (`transfer_out` at the source, `transfer_in` at the destination) that
        reference each other through `transfer_movement_id`.
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockTransferRequest' } } }
      responses: { '201': { description: Transfer recorded, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/StockTransferResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/suppliers:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listSuppliers
      summary: List suppliers
      description: Requires the `supplier.view` permission. Ordered by name.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: archived, in: query, description: "`true` lists only archived suppliers, `false` only active ones.", schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { name: q, in: query, description: 'Free-text search on name, email or phone.', schema: { type: string, maxLength: 255 } }
        - { name: sort, in: query, description: Sort field; a leading `-` reverses the order., schema: { type: string, enum: [name, '-name', created_at, '-created_at'], default: name } }
      responses: { '200': { description: Paginated suppliers, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedSuppliersResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: createSupplier
      summary: Create a supplier
      description: Requires the `supplier.create` permission. Supplier names are not unique.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSupplierRequest' } } }
      responses: { '201': { description: Supplier created, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/suppliers/{supplier}:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/SupplierId' }
    get:
      operationId: getSupplier
      summary: Get a supplier
      description: Requires the `supplier.view` permission.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Supplier details, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
    patch:
      operationId: updateSupplier
      summary: Update a supplier
      description: Requires the `supplier.update` permission. Only the fields present in the body change.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSupplierRequest' } } }
      responses: { '200': { description: Supplier updated, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/suppliers/{supplier}/archive:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/SupplierId' }
    post:
      operationId: archiveSupplier
      summary: Archive a supplier
      description: Requires the `supplier.archive` permission. An archived supplier cannot receive goods. Suppliers are archived, never deleted.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Supplier archived, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/goods-receipts:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listGoodsReceipts
      summary: List goods receipts
      description: Requires the `purchase.view` permission. Receipts are immutable and ordered most recent first.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: supplier_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: location_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
      responses: { '200': { description: Paginated goods receipts, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedGoodsReceiptsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: recordGoodsReceipt
      summary: Record a goods receipt
      description: |
        Requires the `purchase.receive` permission. The receipt is finalized on creation: each line
        snapshots the product name and unit cost and produces one immutable `receipt` stock movement
        carrying the cost, so the receipt never edits stock balances directly (ADR 0035). The server
        assigns the sequential document number and computes the line and document totals; client
        totals are never accepted. An archived supplier, a non-stocked product, or a non-positive
        quantity is rejected.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateGoodsReceiptRequest' } } }
      responses: { '201': { description: Receipt recorded, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/GoodsReceiptResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/goods-receipts/{receipt}:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/ReceiptId' }
    get:
      operationId: getGoodsReceipt
      summary: Get a goods receipt
      description: Requires the `purchase.view` permission.
      tags: [Purchasing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Receipt details, content: { application/json: { schema: { $ref: '#/components/schemas/GoodsReceiptResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/customers:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listCustomers
      summary: List customers
      description: Requires the `customer.view` permission. Ordered by name.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: archived, in: query, description: "`true` lists only archived customers, `false` only active ones.", schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { name: q, in: query, description: 'Free-text search on name, email or phone.', schema: { type: string, maxLength: 255 } }
        - { name: sort, in: query, description: Sort field; a leading `-` reverses the order., schema: { type: string, enum: [name, '-name', created_at, '-created_at'], default: name } }
      responses: { '200': { description: Paginated customers, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedCustomersResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: createCustomer
      summary: Create a customer
      description: Requires the `customer.create` permission. Customer names are not unique.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCustomerRequest' } } }
      responses: { '201': { description: Customer created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/customers/{customer}:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/CustomerId' }
    get:
      operationId: getCustomer
      summary: Get a customer
      description: Requires the `customer.view` permission.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Customer details, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
    patch:
      operationId: updateCustomer
      summary: Update a customer
      description: Requires the `customer.update` permission. Only the fields present in the body change.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCustomerRequest' } } }
      responses: { '200': { description: Customer updated, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/customers/{customer}/archive:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/CustomerId' }
    post:
      operationId: archiveCustomer
      summary: Archive a customer
      description: Requires the `customer.archive` permission. An archived customer cannot be invoiced. Customers are archived, never deleted.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Customer archived, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/tax-settings:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: getTaxSettings
      summary: Get the organization tax settings
      description: Requires the `invoice.view` permission. Returns the defaults when nothing is configured yet.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Tax settings, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSettingsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
    patch:
      operationId: updateTaxSettings
      summary: Update the organization tax settings
      description: |
        Requires the `invoice.manage` permission. A rate is required when tax is enabled. The rate is a
        percentage at the unit price scale (e.g. `7.5` stores 7.5000). Issued invoices snapshot the
        settings at issue time; changing them never rewrites issued documents.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTaxSettingsRequest' } } }
      responses: { '200': { description: Tax settings updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSettingsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/invoices:
    parameters: [{ $ref: '#/components/parameters/NestedOrganizationId' }]
    get:
      operationId: listInvoices
      summary: List invoices
      description: Requires the `invoice.view` permission. Ordered most recent first.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: customer_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
      responses: { '200': { description: Paginated invoices, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedInvoicesResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
    post:
      operationId: createInvoice
      summary: Create a draft invoice
      description: |
        Requires the `invoice.create` permission. A draft carries no document number and no tax;
        the server computes the line totals from validated inputs and never accepts client totals
        (ADR 0036).
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvoiceRequest' } } }
      responses: { '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/invoices/{invoice}:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    get:
      operationId: getInvoice
      summary: Get an invoice
      description: Requires the `invoice.view` permission.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Invoice details, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }
    patch:
      operationId: updateInvoice
      summary: Update a draft invoice
      description: |
        Requires the `invoice.update` permission. Only a draft is editable; lines are replaced as a
        whole when present. An issued invoice is frozen.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateInvoiceRequest' } } }
      responses: { '200': { description: Draft updated, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/invoices/{invoice}/issue:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    post:
      operationId: issueInvoice
      summary: Issue a draft invoice
      description: |
        Requires the `invoice.issue` permission. Issue assigns the organization-scoped sequential
        document number, snapshots the customer, tax settings, and every line's commercial values,
        and freezes the document (ADR 0036). A draft needs at least one line. There is no un-issue.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Invoice issued, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/invoices/{invoice}/void:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    post:
      operationId: voidInvoice
      summary: Void an invoice
      description: Requires the `invoice.void` permission. Void is terminal; the record is retained as evidence and never deleted. Credit notes are a future direction.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Invoice voided, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/invoices/{invoice}/send:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    post:
      operationId: sendInvoice
      summary: Send an issued invoice over a delivery channel
      description: |
        Requires the `invoice.send` permission and an issued invoice. Accepts `email`, `sms`, or
        `whatsapp`; the recipient defaults from the attached customer's email (email channel) or
        phone (sms/whatsapp), and an explicit recipient overrides it. The delivery attempt is
        tracked; the message content is built server-side from the snapshot (ADR 0037). Delivery
        state never changes the invoice.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendInvoiceRequest' } } }
      responses: { '202': { description: Delivery accepted, headers: { Idempotent-Replayed: { description: '`true` when the response was replayed from a stored idempotency record.', schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDeliveryResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/EmailNotVerified' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/IdempotencyConflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }

  /organizations/{organization}/invoices/{invoice}/deliveries:
    parameters:
      - { $ref: '#/components/parameters/NestedOrganizationId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    get:
      operationId: listInvoiceDeliveries
      summary: List the delivery attempts for an invoice
      description: Requires the `invoice.view` permission. Ordered most recent first.
      tags: [Invoicing]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated delivery attempts, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedNotificationDeliveriesResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimited' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token

    OrganizationSelector:
      type: apiKey
      in: header
      name: X-Organization-ID
      description: |
        Selects an organization for tenant-authenticated routes; the server verifies active
        membership before the selection is used. A subdomain selector (for example
        `myorg.flowos.local`) is an equivalent alternative to this header.

  parameters:
    Page:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    NestedOrganizationId:
      name: organization
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    BranchId:
      name: branch
      in: path
      required: true
      description: Branch UUID
      schema:
        type: string
        format: uuid

    MembershipId:
      name: membership
      in: path
      required: true
      schema: { type: string, format: uuid }

    InvitationId:
      name: invitation
      in: path
      required: true
      schema: { type: string, format: uuid }

    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    RoleId:
      name: role
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProductId:
      name: product
      in: path
      required: true
      schema: { type: string, format: uuid }

    CategoryId:
      name: category
      in: path
      required: true
      schema: { type: string, format: uuid }

    LocationId:
      name: location
      in: path
      required: true
      schema: { type: string, format: uuid }

    SupplierId:
      name: supplier
      in: path
      required: true
      schema: { type: string, format: uuid }

    ReceiptId:
      name: receipt
      in: path
      required: true
      schema: { type: string, format: uuid }

    CustomerId:
      name: customer
      in: path
      required: true
      schema: { type: string, format: uuid }

    InvoiceId:
      name: invoice
      in: path
      required: true
      schema: { type: string, format: uuid }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes this write replay-safe. Repeating the request with the same key and the same
        payload returns the original response with `Idempotent-Replayed: true`. Reusing the key
        with a different payload returns `409 IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        maxLength: 100

  schemas:
    UUID:
      type: string
      format: uuid
      example: "018f4c8e-7b3d-7c8a-9f4e-1a2b3c4d5e6f"

    UserStatus:
      type: string
      enum: [active, suspended, disabled]

    OrganizationStatus:
      type: string
      enum: [active, suspended, closed]

    MembershipStatus:
      type: string
      enum: [invited, active, suspended, revoked]

    BranchStatus:
      type: string
      enum: [active, inactive, closed]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: flowos-api

    Organization:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          example: "Acme Trading Co."
        legal_name:
          type: string
          nullable: true
        business_type:
          type: string
          nullable: true
        registration_number:
          type: string
          nullable: true
        slug:
          type: string
          example: "acme-trading"
        timezone:
          type: string
          example: "Africa/Lagos"
        currency:
          type: string
          example: "NGN"
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        settings:
          type: object
          nullable: true
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
          default: "Africa/Lagos"
        currency:
          type: string
          default: "NGN"

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 50
        timezone:
          type: string
        currency:
          type: string
        settings:
          type: object

    OrganizationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Organization'

    PaginatedOrganizationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    Branch:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        code:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address_line_1:
          type: string
          nullable: true
        address_line_2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          nullable: true
        is_primary:
          type: boolean
        status:
          $ref: '#/components/schemas/BranchStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBranchRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        is_primary:
          type: boolean
          default: false

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'

    BranchResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Branch'

    PaginatedBranchesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationMembership:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        joined_at:
          type: string
          format: date-time
          nullable: true
        suspended_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    AuthRegisterRequest:
      type: object
      required:
        - email
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthTokenRequest:
      allOf:
        - $ref: '#/components/schemas/AuthLoginRequest'
        - type: object
          required: [client_name]
          properties:
            client_name: { type: string, maxLength: 255 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    AuthenticatedUserResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }

    TokenResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        user: { $ref: '#/components/schemas/User' }

    MfaChallengeResponse:
      type: object
      required: [mfa_required, challenge, expires_at, methods]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        challenge:
          type: string
          description: Opaque single-use challenge that must be redeemed with a second factor.
        expires_at: { type: string, format: date-time }
        methods:
          type: array
          items: { type: string, enum: [totp, recovery_code] }

    MfaEnrollmentResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            secret:
              type: string
              description: Base32 shared secret to register in an authenticator application.
            otpauth_uri:
              type: string
              description: otpauth URI to open in an authenticator application.

    MfaRecoveryCodesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            recovery_codes:
              type: array
              description: Single-use recovery codes, returned exactly once.
              items: { type: string }

    MfaCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A time-based one-time password or a single-use recovery code.

    MfaVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string }
        code:
          type: string
          description: A time-based one-time password or a single-use recovery code.

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    OrganizationMembershipResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationMembership' } }
    OrganizationMembershipCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationMembership' } } }
    OrganizationInvitation:
      type: object
      required: [id, email, state, expires_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        email: { type: string, format: email }
        state: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        declined_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        invited_by: { $ref: '#/components/schemas/User' }
    OrganizationInvitationResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationInvitation' } }
    OrganizationInvitationCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationInvitation' } } }
    CreateInvitationRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    InvitationInspectionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            organization_name: { type: string }
            email: { type: string, format: email }
            expires_at: { type: string, format: date-time }
            state: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
    InvitationLifecycleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationInvitation' } }
    MembershipLifecycleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/OrganizationMembership' } }
    Permission:
      type: object
      properties: { id: { $ref: '#/components/schemas/UUID' }, key: { type: string }, description: { type: string, nullable: true } }
    PermissionCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Permission' } } }
    Role:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    RoleResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/Role' } }
    RoleCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Role' } } }
    CreateRoleRequest:
      type: object
      required: [name]
      properties: { name: { type: string }, description: { type: string }, permission_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    UpdateRoleRequest:
      type: object
      properties: { name: { type: string }, description: { type: string }, permission_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    AssignRolesRequest:
      type: object
      required: [role_ids]
      properties: { role_ids: { type: array, items: { $ref: '#/components/schemas/UUID' } } }
    EffectivePermissionsResponse:
      type: object
      properties:
        data:
          type: object
          properties: { roles: { type: array, items: { $ref: '#/components/schemas/Role' } }, permissions: { type: array, items: { type: string } } }
    Device:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        platform: { type: string }
        device_name: { type: string, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    DeviceResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/Device' } }
    DeviceCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Device' } } }
    CreateDeviceRequest:
      type: object
      required: [platform]
      properties: { platform: { type: string }, device_name: { type: string } }
    AuditEvent:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        event_type: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid, nullable: true }
        actor_user_id: { type: string, format: uuid, nullable: true }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
    AuditEventCollection:
      type: object
      properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }

    ProductType:
      type: string
      description: |
        How a product behaves in inventory. A `stocked` product is tracked in inventory and is
        the only kind that may take stock movements and balances; a `non_stocked` product is
        bought and resold without tracking; a `service` has no stock at all.
      enum: [stocked, non_stocked, service]

    StockMovementType:
      type: string
      description: |
        The reason a stock movement was recorded. The direction is a property of the category:
        `opening`, `receipt`, and `return` increase stock; `sale` and `transfer_out` decrease it;
        `transfer_in` increases it at the destination; `adjustment` and `count` carry a signed
        variance. The server applies the sign for the fixed-direction categories, so a client
        never states a negative quantity for them.
      enum: [opening, receipt, sale, return, adjustment, transfer_in, transfer_out, count]

    DecimalString:
      type: string
      description: |
        An exact decimal transported as a string so no client parses it as a binary floating
        point number. Canonical form: optional leading `-`, a required integer part, at most
        the stated number of fractional digits, no thousands separators and no trailing point.
      pattern: '^-?\d+(\.\d+)?$'

    UnitOfMeasure:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        code:
          type: string
          example: "kg"
        name:
          type: string
          example: "Kilogram"
        precision:
          type: integer
          description: The maximum number of decimal places a quantity in this unit may carry (0-3).
          minimum: 0
          maximum: 3
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        sku:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/ProductType'
        price:
          type: string
          description: Exact unit price decimal string in the organization currency, carried to the unit price scale of 4 fractional digits.
          pattern: '^-?\d+(\.\d{1,4})?$'
          example: "1500.0000"
        tax_code:
          type: string
          nullable: true
        unit_of_measure:
          $ref: '#/components/schemas/UnitOfMeasure'
        category:
          $ref: '#/components/schemas/Category'
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InventoryLocation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        branch_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 150
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StockMovement:
      type: object
      description: |
        An immutable record of a stock change. A movement is never edited or deleted; a
        mistake is repaired by recording a correction that points at the movement it reverses.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        location_id:
          $ref: '#/components/schemas/UUID'
        type:
          $ref: '#/components/schemas/StockMovementType'
        quantity:
          type: string
          description: |
            The signed applied quantity as an exact decimal string in thousandths of a unit of
            measure (at most 3 fractional digits). Positive increases stock, negative decreases it.
          pattern: '^-?\d+(\.\d{1,3})?$'
          example: "-12.500"
        unit_cost:
          type: string
          description: Exact decimal string on the unit price scale of 4 fractional digits, when the movement carries one.
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
        reference:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
          description: Business context for when the change happened; not the ordering key.
        corrects_movement_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        transfer_movement_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: The other half of a transfer pair; set on both halves.
        created_at: { type: string, format: date-time }

    StockBalance:
      type: object
      description: A derived read model of the quantity on hand; maintained from movements, never client-writable.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        location_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          $ref: '#/components/schemas/DecimalString'
        product:
          $ref: '#/components/schemas/Product'
        location:
          $ref: '#/components/schemas/InventoryLocation'
        updated_at: { type: string, format: date-time }

