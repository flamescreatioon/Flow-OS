      properties:
        tax_enabled:
          type: boolean
        tax_rate_percent:
          type: string
          description: Required (and must be positive) when tax is enabled; canonical decimal at most 4 fractional digits.
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
        tax_mode:
          $ref: '#/components/schemas/TaxMode'

    Customer:
      type: object
      description: Organization-scoped billing master data. Archived, never deleted; never an authentication identity.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          maxLength: 200
        email:
          type: string
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
        archived_at:
          type: string
          format: date-time
