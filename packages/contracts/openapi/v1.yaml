        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    InvoiceStatus:
      type: string
      description: A draft is editable and carries no number; issue snapshots and freezes; void is terminal (ADR 0036).
      enum: [draft, issued, voided]

    TaxMode:
      type: string
      description: Exclusive adds tax on top of the line totals; inclusive treats the stated price as containing the tax.
      enum: [exclusive, inclusive]

    NotificationChannelName:
      type: string
      description: The logical transport for a delivery (ADR 0037).
      enum: [email, sms, whatsapp]

    NotificationDeliveryStatus:
      type: string
      description: The state of one delivery attempt; delivery state never feeds back into business correctness.
      enum: [queued, sent, failed]

    TaxSettings:
      type: object
      description: Organization-level tax configuration (ADR 0036). One row per organization; issued invoices snapshot it.
      properties:
        organization_id:
          $ref: '#/components/schemas/UUID'
        tax_enabled:
          type: boolean
        tax_rate_percent:
          type: string
          description: The rate as an exact percentage decimal string at the unit price scale, e.g. "7.5000" for 7.5%. Null when not configured.
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
        tax_mode:
          $ref: '#/components/schemas/TaxMode'
        updated_at:
          type: string
          format: date-time
          nullable: true

    TaxSettingsResponse:
