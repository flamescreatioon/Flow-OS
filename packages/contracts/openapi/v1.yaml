        counted_quantity:
          type: string
          description: The quantity the count observed; never the balance. The server computes the variance. May not carry more decimal places than the product's unit of measure allows.
          pattern: '^\d+(\.\d{1,3})?$'
        reference:
          type: string
          maxLength: 100
          nullable: true
        note:
